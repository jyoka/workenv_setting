# AeroSpace config (master copy). Install: cp config/aerospace/aerospace.toml ~/.aerospace.toml
# Rule: every shortcut is ctrl-alt (Ctrl+Option). Add shift to move instead of focus.
# Plain alt-arrows are left alone because macOS uses them to jump by word.

config-version = 2
after-startup-command = []
start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false
persistent-workspaces = ["1", "2", "3", "4", "5"]
key-mapping.preset = 'qwerty'

# External monitor (secondary) gets 1-3, laptop screen (main) gets 4-5.
[workspace-to-monitor-force-assignment]
1 = 'secondary'
2 = 'secondary'
3 = 'secondary'
4 = 'main'
5 = 'main'

[gaps]
inner.horizontal = 8
inner.vertical =   8
outer.left =       8
outer.bottom =     8
outer.top =        8
outer.right =      8

[mode.main.binding]
    # Focus / move windows. Arrows cross into the other monitor at the screen edge.
    ctrl-alt-left  = 'focus --boundaries all-monitors-outer-frame left'
    ctrl-alt-down  = 'focus --boundaries all-monitors-outer-frame down'
    ctrl-alt-up    = 'focus --boundaries all-monitors-outer-frame up'
    ctrl-alt-right = 'focus --boundaries all-monitors-outer-frame right'
    ctrl-alt-shift-left  = 'move --boundaries all-monitors-outer-frame left'
    ctrl-alt-shift-down  = 'move --boundaries all-monitors-outer-frame down'
    ctrl-alt-shift-up    = 'move --boundaries all-monitors-outer-frame up'
    ctrl-alt-shift-right = 'move --boundaries all-monitors-outer-frame right'

    # Size and layout
    ctrl-alt-minus = 'resize smart -50'
    ctrl-alt-equal = 'resize smart +50'
    ctrl-alt-f     = 'fullscreen'
    ctrl-alt-slash = 'layout tiles horizontal vertical'
    ctrl-alt-comma = 'layout accordion horizontal vertical'
    ctrl-alt-space = 'layout floating tiling'

    # Workspaces
    ctrl-alt-1 = 'workspace 1'
    ctrl-alt-2 = 'workspace 2'
    ctrl-alt-3 = 'workspace 3'
    ctrl-alt-4 = 'workspace 4'
    ctrl-alt-5 = 'workspace 5'
    ctrl-alt-shift-1 = 'move-node-to-workspace 1'
    ctrl-alt-shift-2 = 'move-node-to-workspace 2'
    ctrl-alt-shift-3 = 'move-node-to-workspace 3'
    ctrl-alt-shift-4 = 'move-node-to-workspace 4'
    ctrl-alt-shift-5 = 'move-node-to-workspace 5'
    ctrl-alt-tab = 'workspace-back-and-forth'
