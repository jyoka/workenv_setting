# Remote LUKS unlock over SSH (always-on.md): bring up the network and dropbear before the
# passphrase prompt, and use encryptssh (mkinitcpio-utils) in place of encrypt so either the
# keyboard (plymouth prompt) or an SSH login can answer it, whichever comes first.
# Sorts after zz_bluetooth.conf, so the bluetooth hook stays in front of the prompt.
_ru_hooks=()
for _h in "${HOOKS[@]}"; do
  if [[ $_h == encrypt ]]; then
    _ru_hooks+=(netconf unlock-sshd encryptssh)
  else
    _ru_hooks+=("$_h")
  fi
done
HOOKS=("${_ru_hooks[@]}")
unset _ru_hooks _h
